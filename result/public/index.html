<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1e8">
    <title>Poll results | Swarm Voting</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="results-shell">
      <header class="topline"><a href="http://localhost:5000">← BACK TO THE POLL</a><span>RESULTS / 001</span></header>
      <section class="heading">
        <p class="eyebrow">CURRENT STANDINGS</p>
        <h1>The people<br>have <i>spoken.</i></h1>
        <p class="total"><strong id="total">0</strong> votes counted <span class="live-dot"></span> LIVE</p>
      </section>
      <section class="bars" aria-label="Vote totals">
        <article class="bar-row">
          <div class="bar-label"><span>🐈 &nbsp; Cats</span><strong id="cats-count">0</strong></div>
          <div class="track"><div class="fill cats-fill" id="cats-bar"></div></div>
        </article>
        <article class="bar-row">
          <div class="bar-label"><span>🐕 &nbsp; Dogs</span><strong id="dogs-count">0</strong></div>
          <div class="track"><div class="fill dogs-fill" id="dogs-bar"></div></div>
        </article>
      </section>
      <p class="status" id="status" role="status" aria-live="polite">Connecting to the tally...</p>
      <footer><span>RESULT SERVICE <b>●</b> STREAMING</span><span>REFRESHES AUTOMATICALLY</span></footer>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
